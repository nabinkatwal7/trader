{% extends "base.html" %}
{% block title %}Strategies · PaperTrader{% endblock %}
{% block content %}
<p class="hero-line reveal">How each strategy thinks</p>
<p class="lede reveal">Same prices, different rules.
  <a href="{% url 'compare' %}">Race them</a> ·
  <a href="{% url 'backtest' %}">Backtest one</a>
</p>

<section class="panel reveal delay-1">
  <div class="strategy-list">
    {% for s in strategies %}
    <article class="strategy-card">
      <h3>{{ s.name }} <span class="tag">{{ s.key }}</span></h3>
      <p class="blurb">{{ s.blurb }}</p>
      <p class="lesson">{{ s.lesson }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
